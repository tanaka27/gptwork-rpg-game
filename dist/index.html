<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141e24"><title>星灯りの旅団 | Starlight Chronicle</title><link rel="stylesheet" href="style.css?v=7"><link rel="stylesheet" href="workspace.css?v=7"></head><body>
<header><a class="brand" href="#">✧ <span>星灯りの旅団<small>STARLIGHT CHRONICLE</small></span></a><div class="chapter">第一章 <span>失われた星のかけら</span></div><button id="sound">♫ 音 OFF</button><button id="help">? 遊び方</button><button id="reset" type="button">↻ リセット</button></header>
<main class="game-shell">
<section class="player-strip" aria-label="冒険者の状態"><h2>アステル <span id="level"></span></h2><div id="stats"></div><span id="saveStatus" class="save-status"></span></section>
<div class="screen-stack">
<section class="game-screen adventure-screen" id="screen-adventure" aria-label="冒険"><section class="arena"><div class="arena-top"><span id="location"></span><span id="phase">EXPLORATION</span></div><div id="landscape"></div><div class="vignette"></div><div id="enemy"></div><div class="scene-caption" id="sceneCaption"></div></section><section class="panel command"><div class="command-head"><span id="commandTitle">次はどこへ向かいますか？</span><span id="turn"></span></div><div id="actions"></div><div id="subactions"></div></section><div id="latestLog" aria-live="polite"></div></section>
<section class="game-screen scroll-screen" id="screen-map" aria-label="地図と移動先" hidden><h2 class="screen-title">世界地図</h2><section class="panel world" id="worldMap"><div class="section-label">WORLD NETWORK <span id="mapPosition"></span></div><div id="networkMap" role="group" aria-label="世界地図。線でつながった隣のノードへ移動できます"></div><p class="map-legend">⚑ 現在地　⌂ 街　♜ ボス　● 探索地　<span>線でつながった場所へ移動できます</span></p></section><section class="panel destinations"><h3>移動先</h3><div id="regions"></div><button class="camp" id="camp">⌂ はじまりの村へ帰る</button></section></section>
<section class="game-screen scroll-screen" id="screen-bag" aria-label="もちもの" hidden><h2 class="screen-title">旅の支度</h2><section class="panel bag"><div class="tabs"><button data-tab="bag" class="active">もちもの</button><button data-tab="materials">素材</button><button data-tab="skills">スキル</button><button data-tab="shop">お店</button></div><div class="wallet">所持金 <b id="gold"></b></div><div id="inventory"></div></section></section>
<section class="game-screen scroll-screen" id="screen-record" aria-label="冒険の記録" hidden><h2 class="screen-title">冒険の記録</h2><section class="panel"><h3>アステルの能力</h3><div id="attributes"></div><div id="equipment" class="equipment"></div></section><section class="panel quest"><div class="section-label">MAIN QUEST <span>✧</span></div><h3 id="questTitle"></h3><p id="questText"></p><div id="questProgress"></div></section><section class="panel journal"><div class="section-label">ADVENTURE LOG <span>冒険の記録</span></div><div id="log" aria-live="polite"></div></section></section>
</div>
<nav class="screen-nav" aria-label="ゲーム画面"><button type="button" data-screen="adventure" aria-pressed="true">⚔ 冒険</button><button type="button" data-screen="map" aria-pressed="false">⌖ 地図</button><button type="button" data-screen="bag" aria-pressed="false">♧ もちもの</button><button type="button" data-screen="record" aria-pressed="false">☷ 記録</button></nav>
</main>
<dialog id="modal"><div id="modalContent"></div><button id="closeModal">閉じる</button></dialog><script src="combat.js?v=7"></script><script src="game.js?v=7"></script></body></html>
