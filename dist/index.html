<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141e24"><title>星灯りの旅団 | Starlight Chronicle</title><link rel="stylesheet" href="style.css?v=8"><link rel="stylesheet" href="workspace.css?v=14"></head><body>
<header><a class="brand" href="#">星灯りの旅団</a><details class="utility-menu"><summary aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3 1-1h4l1 3 3 1 3 1v4l-2 2-1 3-1 3h-4l-2-2-3-1-3-1v-4l2-2 1-3Z"/><circle cx="12" cy="12" r="3"/></svg></summary><div class="utility-content"><button id="sound" type="button">音 OFF</button><button id="help" type="button">遊び方</button><button id="reset" type="button">リセット</button></div></details></header>
<main class="game-shell">
<section class="player-strip" aria-label="冒険者の状態"><h2>アステル <span id="level"></span></h2><div id="stats"></div><span id="saveStatus" class="save-status"></span></section>
<div id="partyStatus" aria-label="味方の状態"></div><div class="screen-stack">
<section class="game-screen adventure-screen" id="screen-adventure" aria-label="冒険"><section class="arena"><div class="arena-top"><span id="phase">EXPLORATION</span></div><div id="landscape"></div><div class="vignette"></div><div id="enemy"></div></section><div class="scene-description"><h2 id="location"></h2><div id="sceneCaption"></div></div><section class="panel command"><div class="command-head"><span id="commandTitle">次はどこへ向かいますか？</span><span id="turn"></span></div><div id="actions"></div><div id="subactions"></div><p id="battleOrder" aria-live="polite"></p></section><div id="latestLog" aria-live="polite"></div></section>
<section class="game-screen scroll-screen" id="screen-map" aria-label="地図と移動先" hidden><h2 class="screen-title">世界地図</h2><section class="panel world" id="worldMap"><div class="section-label">WORLD NETWORK <span id="mapPosition"></span></div><div id="networkMap" role="group" aria-label="世界地図。線でつながった隣のノードへ移動できます"></div><p class="map-legend">⚑ 現在地　⌂ 街　♜ ボス　● 探索地　<span>線でつながった場所へ移動できます</span></p></section><section class="panel destinations"><h3>移動先</h3><div id="regions"></div><button class="camp" id="camp">⌂ はじまりの村へ帰る</button></section></section>
<section class="game-screen scroll-screen" id="screen-bag" aria-label="もちもの" hidden><h2 class="screen-title">旅の支度</h2><section class="panel bag"><div class="tabs"><button data-tab="bag" class="active">もちもの</button><button data-tab="materials">素材</button><button data-tab="skills">スキル</button><button data-tab="shop">お店</button></div><div class="wallet">所持金 <b id="gold"></b></div><div id="inventory"></div></section></section>
<section class="game-screen scroll-screen" id="screen-party" aria-label="仲間" hidden><div id="partyListView"><h2 class="screen-title">仲間</h2><p class="party-note">キャラクターを選ぶと、詳しいステータスを確認できます。</p><div id="characterList"></div></div><div id="partyDetailView" hidden><button type="button" id="backToParty">← 仲間一覧へ</button><div id="partyDetails"></div><p class="party-note">レベル・装備・攻撃力・守備力・賢さは旅団で共通です。</p></div></section>
<section class="game-screen scroll-screen" id="screen-record" aria-label="冒険の記録" hidden><h2 class="screen-title">冒険の記録</h2><section class="panel"><h3>旅団の能力・装備</h3><div id="attributes"></div><div id="equipment" class="equipment"></div></section><section class="panel quest"><div class="section-label">MAIN QUEST <span>✧</span></div><h3 id="questTitle"></h3><p id="questText"></p><div id="questProgress"></div></section><section class="panel journal"><div class="section-label">ADVENTURE LOG <span>冒険の記録</span></div><div id="log" aria-live="polite"></div></section></section>
</div>
<nav class="screen-nav" aria-label="ゲーム画面"><button type="button" data-screen="adventure" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 20 8-16 8 16M8 20l4-8 4 8M5 20h14"/></svg><span>冒険</span></button><button type="button" data-screen="map" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2ZM9 3v16m6-14v16"/></svg><span>地図</span></button><button type="button" data-screen="bag" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 3 2 4c-5 5-7 8-6 12 2 3 14 3 16 0 1-4-1-7-6-12l2-4ZM10 7h4"/></svg><span>もちもの</span></button><button type="button" data-screen="party" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5v2"/></svg><span>仲間</span></button><button type="button" data-screen="record" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5C8 2 4 3 2 4v16c4-2 7-1 10 1 3-2 6-3 10-1V4c-3-1-6-2-10 1Zm0 0v16"/></svg><span>記録</span></button></nav>
</main>
<dialog id="modal"><div id="modalContent"></div><button id="closeModal">閉じる</button></dialog><link rel="preload" as="image" href="assets/village.png"><script src="combat.js?v=8"></script><script src="game.js?v=11"></script><script src="party.js?v=4"></script></body></html>
