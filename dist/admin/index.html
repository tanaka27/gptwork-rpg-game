<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>データ管理 | 星灯りの旅団</title><link rel="stylesheet" href="/admin/style.css"></head><body><header><a href="/">← ゲームへ</a><h1>ゲームデータ管理</h1><p>下書きで編集・確認してから、ゲームに公開します。</p></header><main><section class="toolbar" aria-label="定義の操作"><label>定義の版<select id="versions"></select></label><button id="create">選んだ版から下書きを作る</button><button id="save">下書きを保存</button><button id="validate">データを検証</button><button id="preview">ゲームでプレビュー</button><button id="publish">この版を公開</button><button id="export">JSONを書き出す</button><label class="import-label">JSONを取り込む<input type="file" id="import" accept="application/json,.json"></label></section><p id="status" role="status" aria-live="polite">読み込み中…</p><p id="versionInfo"></p><label>定義の名前<input id="label" maxlength="100"></label><details><summary>成長・道中・戦闘の設定</summary><div id="rulesEditor"></div></details><div class="workspace"><aside><label>種類<select id="category"></select></label><div class="row"><button id="add">追加</button><button id="duplicate">複製</button><button id="remove">削除</button></div><label>絞り込み<input id="search" type="search" placeholder="名前・IDで検索"></label><div id="entries" aria-label="定義一覧"></div></aside><section class="editor" aria-labelledby="editorTitle"><h2 id="editorTitle">定義を選択</h2><form id="editor"></form></section></div></main><script src="/shared/content.js?v=3"></script><script src="/admin/admin.js?v=3" defer></script></body></html>
